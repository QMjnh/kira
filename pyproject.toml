[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "local-audit", ".test-deps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kira"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
